  summary: Kimsukyは、少なくとも2012年から活動している朝鮮民主主義人民共和国（DPRK）を拠点とするサイバースパイグループです。同グループは当初、韓国の政府機関、シンクタンク、および様々な分野の専門家を標的としていました。その活動範囲は、国連や、米国、日本、ロシア、欧州における政府、教育、ビジネスサービス、製造セクターの組織へと拡大しています。Kimsukyは、朝鮮半島に関連する外交政策や国家安全保障問題、核政策、および制裁に関する情報の収集に重点を置いてきました。Kimsukyの活動は、アドホックな協力やその他の限定的なリソース共有の結果、他の北朝鮮政府支援のサイバースパイアクターの活動と重複しています。Kimsukyは2014年のKorea
    Hydro & Nuclear Power Co.への侵害の責任があると評価されています。その他の注目すべきキャンペーンには、Operation STOLEN
    PENCIL (2018)、Operation Kabar Cobra (2019)、およびOperation Smoke Screen (2019)があります。2023年には、Kimsukyが脆弱性調査、スクリプティング、ソーシャルエンジニアリング、および偵察を支援するために商用の大規模言語モデル（LLM）を使用していることが観測されました。オープンソースのレポートではDPRK脅威アクタークラスターの境界は重複しており、一部のセキュリティ研究者は、運用上異なるサブグループを追跡するのではなく、帰属が特定されたすべての北朝鮮政府支援のサイバー活動をLazarus
