  summary: FIN7は、2013年から活動している金銭目的の脅威グループです。FIN7は、米国の小売、レストラン、ホスピタリティ、ソフトウェア、コンサルティング、金融サービス、医療機器、クラウドサービス、メディア、飲食、運輸、製薬、およびユーティリティ業界を標的にしてきました。FIN7の一部はCombi
    Securityというフロント企業から運営されており、攻撃活動においてpoint-of-sale malwareを頻繁に使用していました。2020年以降、FIN7はREvil
    ransomwareや独自のRansomware-as-a-Service (RaaS)であるDarksideの使用を含む、big game hunting
    (BGH)へと作戦をシフトさせています。FIN7はCarbanak Groupと関連がある可能性がありますが、複数の脅威グループがCarbanakを使用していることが観測されているため、これらのグループは個別に追跡されています。
