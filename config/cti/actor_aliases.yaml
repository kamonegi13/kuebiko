    Groupという広範なアクターの傘下に含まれており、少なくとも2018年から活動しています。また、同じ傘下にある別の北朝鮮関連グループであるTEMP.hermitとリソース面で密接に連携しています。同グループの主な任務は、政府への資金提供を行うための収益を生成し、洗浄することです。AppleJeusは主に暗号資産業界を標的としており、特に3CX
