  summary: APT29は、ロシアのForeign Intelligence Service (SVR) の関与が特定されている脅威グループです。少なくとも2008年から活動しており、欧州やNATO加盟国の政府ネットワーク、研究機関、シンクタンクを標的とすることが頻繁にあります。APT29は、2015年夏からDemocratic
    National Committeeへの侵害を行ったと報告されています。2021年4月、米英政府はSolarWinds Compromiseの責任をSVRにあると断定しました。その公的な声明には、APT29、Cozy
    Bear、The Dukesへの言及が含まれていました。業界のレポートでは、このキャンペーンに関与したアクターをUNC2452、NOBELIUM、StellarParticle、Dark
    Halo、SolarStormとも呼んでいます。
