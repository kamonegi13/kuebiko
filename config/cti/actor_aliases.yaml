  summary: Akiraは、少なくとも2023年3月から活動しているランサムウェアのバリアントおよびランサムウェア展開主体です。Akiraは、初期潜入（initial
    access）のために、侵害された認証情報を使用してVPNなどの単要素認証の外部アクセスメカニズムにアクセスし、その後、横展開（lateral movement）のために様々な公開ツールや手法を使用します。Akiraのオペレーションは「二重脅迫（double
    extortion）」型のランサムウェア活動に関連しており、暗号化の前に被害者の環境からデータを窃取し、身代金が支払われない場合にはファイルを公開すると脅迫します。Akiraランサムウェアの技術分析によれば、WindowsまたはVMWare
    ESXiハイパーバイザーを標的とすることが可能なバリアントが存在し、Contiランサムウェアとの多くの重複が認められます。
