  summary: Andarielは、少なくとも2009年から活動している北朝鮮の国家支援型脅威グループです。Andarielは、破壊的な攻撃を含むそのオペレーションにおいて、主に韓国の政府機関、軍事組織、および様々な国内企業を標的としてきました。また、ATM、銀行、暗号資産取引所に対してもサイバー金融攻撃を行っています。Andarielの注目すべき活動には、Operation
    Black Mine、Operation GoldenAxe、およびCampaign Rifleがあります。AndarielはLazarus Groupのサブセットとみなされており、北朝鮮のReconnaissance
    General Bureau（偵察総局）によるものと特定されています。北朝鮮のグループ定義には大幅な重複があることが知られており、一部のセキュリティリサーチャーは、クラスターやサブグループを個別に追跡するのではなく、すべての北朝鮮国家支援型サイバー活動をLazarus
