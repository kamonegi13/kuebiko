  summary: Lazarus Groupは、北朝鮮のReconnaissance General Bureau (RGB) に帰属するとされる、国家支援型のサイバー脅威グループです。Lazarus
    Groupは少なくとも2009年から活動しており、NovettaによってOperation Blockbusterの一環と特定された、2014年11月のSony
    Pictures Entertainmentに対する破壊的なwiper攻撃の実行犯であると報告されています。Lazarus Groupが使用するマルウェアは、Operation
    Flame、Operation 1Mission、Operation Troy、DarkSeoul、Ten Days of Rainなど、他の報告されたキャンペーンとも相関しています。北朝鮮のサイバーオペレーションは、国家の優先事項の変化に伴い、部隊を形成・再編するという一貫した適応パターンを示しています。これらの部隊は人員、インフラ、マルウェア、およびtradecraftを頻繁に共有しているため、特定のオペレーションを高い確信度で帰属させることは困難です。公開されている報告では、諜報活動、破壊的攻撃、および金銭目的のキャンペーンを行う複数の北朝鮮のサイバーオペレーターを指す包括的な用語として、「Lazarus
    Group」が頻繁に使用されます。
