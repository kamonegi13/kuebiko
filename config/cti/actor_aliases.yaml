  nation: cn
  sponsor: PRC State-Sponsored
  description: 米重要インフラへの事前配置を継続する中国系 APT
  family: typhoon
  summary: Volt Typhoonは、少なくとも2021年から活動している中華人民共和国（PRC）の国家支援型アクターであり、主に米国およびGuamを含むその領土内の重要インフラ組織を標的にしています。Volt
    Typhoonの標的設定と行動パターンは、潜在的な破壊的または妨害的な攻撃に向けて、operational technology (OT) アセットへのlateral
    movementを可能にするためのpre-positioningであると評価されています。Volt Typhoonは、web shells、living-off-the-land
    (LOTL) binaries、hands on keyboard活動、および盗まれた認証情報を用いた、オペレーションにおける隠密性を重視しています。同グループは、compromised
    SOHOルーターを利用してcommand and controlトラフィックをプロキシし、自らのインフラを隠蔽しており、これはKV botnetに関連する活動です。報告によると、別のinitial
    accessクラスターであるSYLVANITEが、インターネットに公開されているedgeデバイスの脆弱性を悪用し、後続のオペレーションのためにVolt Typhoon（VOLTZITEとしても追跡）へアクセスを転送していることが確認されています。
  associated_malware:
  - FRP
  - Impacket
  - Mimikatz
  - Net
