# Phase H: Diamond Model "Victim" vertex の country 正規化辞書 (2026-05-19)
#
# ISO 3166-1 alpha-2 を canonical。display は日本語化。
# 2026-06-17 拡充: CTI 報道で頻出する主要国を 20 → 約 80 ヶ国に拡大。
#   victim_country の解決率改善 (Italy / Lebanon / Singapore 等が null になっていた) と
#   地図 (geocoder.py) の plot 対象拡大が目的。新国は引き続き LLM 提案で週次追加可。
#
# 各 canonical は ISO2 自身も alias として自動登録される (taxonomy_normalizer)。
# aliases は小文字照合。日本語名 / 英語名 / ISO3 / 慣用表記を網羅する。
# **座標は src/cti/geocoder.py の _COUNTRY_CENTROIDS に首都点として持つ** (両者の ISO 集合は
# tests/unit/test_geocoder.py の drift-guard で同期を強制)。

