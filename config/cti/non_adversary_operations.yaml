# 敵の作戦ではない作戦名 (2026-09-27) — campaign 指標から外す。
#
# campaign 指標は STIX の Campaign (攻撃者の作戦) の名前に限る (docs/research/event_knowledge_graph.md §18)。
# 軍事作戦・制裁プログラム・法執行の摘発作戦が「Operation ○○」の正規表現で campaign として入り、
# 台帳の割当の **強い鍵** になっていた (例: 軍事作戦名 1 つでイラン情勢の記事が 1 つの台帳へ吸い寄せられる)。
# 初期値は実データ 85 件を Opus が見出しつきで分類した結果の high / medium (data/mlx/classify_operations.py)。
# 照合は大文字小文字を無視して「Operation」を除いた名前で行う (src/cti/mention_tagger.py)。
