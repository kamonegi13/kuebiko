# TTP 抽出の裏付け語 (2026-09-27) — LLM が付けた ATT&CK 技術を、本文にその手口の記述があるときだけ採る。
#
# 背景: LLM の TTP は本文で裏付けられるのが 3-4 割 (Opus 盲検、docs/research/event_knowledge_graph.md §19)。
# 定番の技術 (添付ファイルのスピアフィッシング・RDP・C2 経由の持ち出し) を当て推量で付ける。
# 照合は src/cti/ttp_evidence.py。T 番号と ATT&CK の技術名 (英語) は辞書 (data/cti/attack_techniques.json)
# から自動で照合するので、ここには **それ以外の言い回し** (日本語・同義の手口) だけを書く。
#
# 書き方: 技術 ID → 正規表現の一覧 (大文字小文字は無視)。
# ⚠ 「悪用される可能性」のような **可能性の記述** に当たる語を入れない (勧告の一般論で通ってしまう)。
# ⚠ 副技術は親の語では通さない (T1566.001 に「phishing」は入れない)。
T1190:  # 公開アプリの脆弱性の悪用 (実際の悪用)
  - '\b(actively|being|been|were|was|are|is)\s+(actively\s+)?exploit(ed|ing)'
  - 'exploit(ed|ation)?\s+in\s+the\s+wild'
  - 'in[- ]the[- ]wild'
  - '(attackers?|hackers?|threat actors?|adversar(y|ies)|operators?)\s+(are\s+|have\s+|had\s+)?(actively\s+|now\s+)?exploit'
  - 'exploitation\s+(attempts?|activity)'
  - '\bKEV\b'
  - '悪用(が確認|を確認|された|されて|している|していた|した|を観測)'
  - '攻撃(を|が)(観測|確認)'
  - '攻擊'
T1078:  # 正規アカウント
  # ⚠ valid / legitimate は入れない (「without valid credentials」= 認証回避の脆弱性に当たる)
  - '(stolen|compromised|leaked|harvested|exposed)\s+(credentials?|accounts?|passwords?|logins?)'
  - '(logged|log|signed|sign)\s+in\s+(using|with)'
  - 'credentials?\s+(stuffing|theft|were\s+stolen)'
  - '認証情報(を|が)?(窃取|悪用|使用|盗|使)'
  - '正規(の)?(アカウント|認証情報)'
  - '不正ログイン'
T1041:  # C2 経由の持ち出し
  - 'exfiltrat\w*\s+(\w+\s+){0,4}(over|via|through|to)\s+(the\s+|its\s+)?(c2|command)'
  - '(send|sends|sent|upload\w*)\s+(the\s+)?(stolen|collected|harvested|exfiltrated)\s+(data|information|files)\s+(back\s+)?to\s+(its|the|a)\s+(c2|server|command)'
  - 'C2\s*(サーバ|サーバー)?(へ|に)(送信|アップロード|持ち出)'
