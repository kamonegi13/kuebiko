version: 2
# Discord 投稿先ルーティングルール (語彙統一モデル、2026-06-14)。
#
# 評価モデル: 上から順に評価し、**最初に when 条件が一致した rule の channel を採用**
# (first-match)。順序が tier を、AND がゲートを表現する。ROUTING_RULES_ENGINE=1 のとき有効。
#
# 条件 (when) は「型付きプロパティ」の boolean 式に一元化 (旧 flag/記事属性 の分離を撤廃):
#   葉:  {property: <id>, op: <op>, value: <val>}
#     boolean (旧 flag): op = is_true | is_false       (例: kev, zero_day, japan_critical)
#     str:               op = eq | ne | in | not_in    (category は in_config も可)
#     set:               op = in | not_in              (actor_nation, keyword_list)
#     number:            op = gte | gt | lte | lt | eq  (max_cvss)
#   結合: {all: [...]} (AND) / {any: [...]} (OR) / {not: <葉|結合>} / {always: true}
#   条件 0 個 / {always: true} = 全件該当 (catch-all)
#
# 旧形 ({flag: x} / {field: {op: val}}) も load 時に正規化され動作する (後方互換)。
# プロパティ一覧は src/cti/routing_rules.py の PROPERTY_CATALOG が SSoT。
#
# label = 「このルールが何をするか」の人向け表示名 (UI の主表示。id は識別子・監査用)。
# 省略可だが、省略すると画面には id しか出せず条件式から意図を読む羽目になる。
rules:
  # ---- R8: APT 内部リーク → 即応 ----
  - id: R8.alert_apt_leak
    label: "APT 内部情報のリーク"
    channel: alert
    when:
      all:
        - {property: apt_leak, op: is_true}
        - {property: article_type, op: not_in, value: [recap, tutorial, opinion, press]}

  # ---- R2: 即応条件 (脅威カテゴリ限定) ----
  - id: R2.alert_japan_critical_apt
    label: "日本の重要インフラ × 既知 APT"
    channel: alert
    when:
      all:
        - {property: article_type, op: not_in, value: [recap, tutorial, opinion, press]}
        - {property: category, op: in_config, value: high_threat_brief_categories}
        - {property: japan_critical, op: is_true}
        - {property: known_apt, op: is_true}
  - id: R2.alert_breaking_kev
    label: "KEV・ゼロデイの速報"
    channel: alert
    when:
      all:
        - {property: article_type, op: eq, value: breaking}
        - {property: category, op: in_config, value: high_threat_brief_categories}
        - any:
            - {property: kev, op: is_true}
            - {property: zero_day, op: is_true}

  # ---- R2e/R2f: 早期警戒 (I&W) — 確証前の兆候を alert へ (2026-08-15) ----
  # alert が「確証済み (KEV/実環境悪用)」専用で、速報・予告・売買広告といった
  # 「まだ起きていないが起きそう」が届かなかった。既に算出済みで未配線だった
  # llm_breaking_critical / keyword_list を配線する。希釈防止のため
  # **日本関連 or 敵性国家アクター** との接続を必須にする。
  # R2g: 国家機関の緊急指令 (CISA ED / JPCERT 緊急 / IPA 緊急対策情報) は
  # 日本関連・敵性国家の限定なしで alert (2026-08-15 再評価)。advisory 一律除外 ×
  # 案 D 限定の相互作用で「日本非言及の緊急指令が watch に落ちる」穴があった。
  # 稀少 (年数回) かつ絶対に落とせないクラスのため無条件で上げる。
  - id: R2g.alert_emergency_directive
    label: "政府機関の緊急指令 (ED / 緊急注意喚起)"
    channel: alert
    when:
      all:
        - {property: article_type, op: not_in, value: [recap, tutorial, opinion, press]}
        - {property: keyword_list, op: in, value: [emergency_directives]}
  - id: R2e.alert_breaking_japan
    label: "日本関連の速報級 (LLM 判定)"
    channel: alert
    when:
      all:
        - {property: article_type, op: not_in, value: [recap, tutorial, opinion, press]}
        - {property: llm_breaking_critical, op: is_true}
        - any:
            - {property: japan_relevant, op: is_true}
            - {property: japan_critical, op: is_true}
  - id: R2f.alert_early_warning
    label: "早期警戒: 予告・アクセス売買・悪用切迫"
    channel: alert
    when:
      all:
        - {property: article_type, op: not_in, value: [recap, tutorial, opinion, press]}
        - {property: keyword_list, op: in, value: [early_warning]}
        - any:
            - {property: japan_mentioned, op: is_true}
            - {property: japan_relevant, op: is_true}
            - {property: actor_nation, op: in, value: [cn, ru, kp, ir]}

  # ---- R3: 日本関連弱信号 → japan_watch ----
  - id: R3.japan_watch
    label: "日本関連の弱信号"
    channel: japan_watch
    when:
      all:
        - {property: japan_relevant, op: is_true}
        - {property: article_type, op: not_in, value: [recap, tutorial, opinion, press]}

  # ---- R3.5: 高重要度の脅威 → brief (形式降格より優先) ----
  - id: R3.5.high_threat_brief
    label: "高重要度の脅威 (形式降格より優先)"
    channel: brief
    when:
      all:
        - {property: importance, op: eq, value: high}
        - {property: category, op: in_config, value: high_threat_brief_categories}
        - {property: stance, op: ne, value: propaganda}

  # ---- R4: 読み物形式は観察送り (衛生・降格) ----
  - id: R4.watch_article_type_demote
    label: "読み物形式は観察送り"
    channel: watch
    when: {property: article_type, op: in, value: [recap, tutorial, opinion, press, research]}

  # ---- R5: 信頼性 all-low (衛生・降格) ----
  - id: R5.watch_low_confidence
    label: "信頼度がすべて低い"
    # 供給 flag は誕生時から到達不能・全期間発火 0 (7/18 無効化。再設計条件は memory 参照)
    enabled: false
    channel: watch
    when: {property: confidence_all_low, op: is_true}

  # ---- R5b: propaganda (衛生・降格) ----
  - id: R5b.propaganda_demote
    label: "プロパガンダは観察送り"
    channel: watch
    when: {property: stance, op: eq, value: propaganda}

  # ---- R6: 朝読 (brief) + 量制御 cap ----
  - id: R6.cap_demote
    label: "朝刊が 1 日の上限に到達"
    # 6/28 通知モデル再設計で brief per-article 投稿が廃止され cap 到達不能 + 効果空 (7/18 無効化)
    enabled: false
    channel: watch
    when:
      all:
        - {property: importance, op: eq, value: medium}
        - {property: security_relevant, op: is_true}
        - {property: brief_cap_reached, op: is_true}
  - id: R6.brief_importance
    label: "重要度 高・中のセキュリティ記事"
    channel: brief
    when:
      all:
        - {property: importance, op: in, value: [high, medium]}
        - {property: security_relevant, op: is_true}

  # ---- R7: フォールバック ----
  - id: R7.fallback
    label: "どれにも当てはまらない記事"
    channel: watch
    when: {always: true}
