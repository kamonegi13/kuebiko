# 敵対的 host の分類 (取得ポリシーの対象)。
# src/tools/hostile_hosts.py が読む。判定は host の suffix 一致 (example.com は www.example.com にも当たる)。
#
# 公開の規則と一覧 (2026-10-30 利用者判断: 敵対国の政府・国営メディア・軍の発信元を収集するのは
# 周知の CTI 実務で、ドメインの一覧は公開してよい)。**SSoT はこの追跡ファイル**。
# 運用者固有の追加分は任意の config/local/hostile_domains.yaml (gitignore、同じ形式、和集合) に置く。
# 公開しないのは運用者の帰属・識別につながるもの (CLAUDE.local.md・ペルソナ・実運用ドメイン)・資格情報・
# 実インシデントの詳細。手順は docs/local_overlay.md。
#
# 編集後は再起動で反映 (プロセス内キャッシュ)。

# ccTLD (host の末尾ラベル)。punycode は xn-- の形で書く (xn--p1ai = .рф)。
cctlds:
  - cn
  - ru
  - su
  - xn--p1ai
  - by
  - kp
  - ir

# origin: report = 机上調査の目録由来 / added = 指示などで追加。ref / note は任意の注記 (判定には使わない)。
