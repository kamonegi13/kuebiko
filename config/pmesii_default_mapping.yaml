# Phase H: PMESII-PT 軸の default mapping (2026-05-19)
#
# enrichment LLM 判定がない / 部分的な article でも軸タグ付けする fallback。
# 最終 axes = LLM 判定 ∪ feed_default ∪ category_default (union 戦略、Recall 重視)。
#
# 編集は Web UI から (CLAUDE.md §12 allowlist 内)。

# feed_title 完全一致 → default axes
