# LLM 判定 category → default axes (feed mapping がない場合の fallback)
category_to_axes:
  apt: [M, I-cyber]
  apt_leak: [M, I-cyber]
  # vulnerability/malware は category 既定では I-cyber のみ (2026-06-04 修正)。
  # 旧 [I-cyber, P] / [I-cyber, M] は全 CVE→政治・全 malware→軍事 を強制し
  # M/P 軸を routine cyber で汚染していた。政治(govt-CERT)/軍事(state-vendor) の
  # 文脈は feed_default と LLM 判定が付与する (union のため本物は失われない)。
  vulnerability: [I-cyber]
  breach: [E, I-cyber]
  malware: [I-cyber]
  advisory: [P, I-cyber]
  policy: [P, I-cyber]
  geopolitical: [M, P]
  incident: [I-cyber]
  research: [I-cyber]
  pir_daily_focus: [I-cyber]
  weekly_recap: [I-cyber]
  other: []
