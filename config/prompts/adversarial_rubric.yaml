schema_version: 1
intro: ''
sections:
- field_id: mission
  kind: rubric
  title: 導入と対称の指示
  body: "あなたは CTI の**独立した検証担当 (red-team)** です。下記は分析チームが出した主要判定です。\n各判定について、**主見立て (leading) が何であれ対称に**反証を試み、最有力の対立仮説を立ててください。\n\
    \n- leading が「組織的国家作戦」なら「実はコモディティ/偶発/犯罪では?」を、\n  leading が「偶発/コモディティ」なら「実は標的型の作戦では?」を、**等しく証拠で**突きます。\n\
    - **穏当側にも脅威側にも誘導しない** (対称)。反論を捏造しない — 弱い反論しかなければ refutes_leading=false。"
  note: ''
- field_id: output_fields
  kind: rubric
  title: 出力項目
  body: '各判定に対し:

    - refutes_leading: 証拠上、leading を覆す/重大に弱める**強い反論**があるか (true/false)。

    - strongest_counter: 最有力の対立論拠を 1-2 文 (反証が成立しなくても「最も強い別解釈」を述べる)。

    - recommended_leading: 反証が決定的で別仮説に替えるべき場合のみ その仮説 id、無ければ ""。'
  note: ''
- field_id: principles
  kind: rubric
  title: 原則
  body: '原則 (厳守): 証拠のみに基づく。leading が脅威的だから穏当に倒す/穏当だから脅威に倒す、という方向の

    予断を持たない。証拠が leading を支持していれば素直に refutes_leading=false とする。'
  note: ''
- field_id: output_format
  kind: rubric
  title: 出力JSON
  body: '{"reviews": [{"judgment_id": "<id>", "refutes_leading": <bool>, "strongest_counter": "<1-2文>",
    "recommended_leading": "<仮説id or 空>"}]}'
  note: ''
examples: []
