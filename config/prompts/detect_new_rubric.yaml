schema_version: 1
intro: ''
sections:
- field_id: mission
  kind: rubric
  title: 導入
  body: 'あなたは CTI のシニア分析官です。下記は本期間 ({{ period_label }}) の記事のうち、

    **既存の追跡情勢のどれにも割当てられなかった残余**です。この中から「新しく追跡を開く価値の

    ある情勢」を選んでください。選ばれた情勢はこの後、本文精読の証拠評価 (ACH) にかけられます。'
  note: ''
- field_id: selection_criteria_intro
  kind: rubric
  title: 選定基準1
  body: '【選定基準 (優先順)】 — この順で重要度を判断する:

    1. SIR (優先情報要求) に直結するサイバー作戦・脅威活動。現在の SIR:'
  note: ''
- field_id: selection_criteria_rest
  kind: rubric
  title: 選定基準2-4
  body: "2. 日本に関わる事象のうち、次のいずれかに当たるもの:\n   - 被害が他の組織へ広がりうる (共通基盤・委託先・SaaS・クラウド・レンタルサーバなど提供者側の侵害)\n   -\
    \ 規模が大きい (多数の組織・利用者に及ぶ)\n   - 手口が深刻 (ランサムウェア・データの破壊・悪用中の脆弱性)\n   - 政府・重要インフラ・防衛関連が標的\n   日本の単一組織の小規模で完結した被害\
    \ (従業員のフィッシング被害、SNS アカウントの乗っ取り、\n   小規模なサイトの改ざん、設定不備や紛失による漏えい、注意喚起) は開かない。\n   これらは配信済みで利用者に届いており、追跡しなくても失われない。\n\
    3. サイバーに隣接する政策・規制・技術動向 (輸出規制、重要インフラ政策等)。\n4. 地政学的文脈 (戦況・外交)。追跡価値があれば開いてよいが、**単発の戦況報道・\n   既知紛争の日々の推移は開かない**\
    \ (それらは文脈であり独立の評価対象ではない)。"
  note: ''
- field_id: rules
  kind: rubric
  title: 規則
  body: "- claim は事象を述べるに留め、帰属・意図はまだ断定しない。\n- 同一事象の複数記事は 1 件にまとめ article_ids に列挙。\n- **開かない判断も仕事**: importance=high\
    \ の記事で開かなかったものは rejected に\n  1 行理由を付ける (例: 「既知事案の再報道」「単発の戦況推移」「評価対象となる主張がない」)。\n- 開く件数に固定枠はないが、追跡に値するものだけ\
    \ (通常 0-3 件、多い日でも 5 件まで)。"
  note: ''
- field_id: output_format
  kind: rubric
  title: 出力JSON
  body: "{\"open\": [{\"claim\": \"<1文>\", \"domain\": \"<political|military|economic|social|infrastructure|information|cyber_incident|geopolitical|tech>\"\
    , \"article_ids\": [\"<id>\", ...]}],\n \"rejected\": [{\"article_id\": \"<id>\", \"reason\": \"<1行>\"\
    }]}"
  note: ''
examples: []
