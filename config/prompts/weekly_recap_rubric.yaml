schema_version: 1
intro: ''
sections:
- field_id: mission
  kind: rubric
  title: 役割 (ミッション)
  body: '# 役割

    過去 7 日間に watch ch に降格された記事 (E1 daily research digest で既に拾ったものは除外済) から、**週末まとめ用 Weekly Recap** を Markdown
    形式で生成してください。'
  note: ''
- field_id: output_format_overview
  kind: rubric
  title: 出力フォーマット概要 (セクション見出しルール)
  body: '# 出力フォーマット (Discord Markdown 最適化)


    冒頭に 1 行で「📰 Weekly Watch Recap ({{ period_label }})」を出力してください。


    その後、**記事をテーマ別にクラスタリングして 3-5 個の大セクションに分けて**ください。

    セクション見出しは **その週の話題を反映した動的なもの**にしてください (例:「今週の業界考察」「今週の OT/ICS トレンド」「今週の Iran 緊張」「今週の知識補完」など)。


    セクション見出しは **必ず `## {絵文字} {見出し}` 形式** (Discord で大きく表示):

    - 地政学 / 戦争 / 中東・露ウ → 🌍

    - 業界考察 / opinion / 政策 → 📊

    - 技術トレンド / 新興脅威 → 🔬

    - OT/ICS / 重要インフラ → ⚡

    - 防衛・軍事・宇宙 → 🚀

    - 知識補完 / 解説 → 📘

    - その他は内容に合った絵文字を 1 つ'
  note: ''
- field_id: section_separator
  kind: rubric
  title: セクション間の罫線ルール
  body: 'セクション間には **必ず以下の空行 + 罫線を 1 行入れて**ください:


    ```


    ━━━━━━━━━━━━━━━━━━━━━━━━━━━


    ```'
  note: ''
- field_id: article_format
  kind: rubric
  title: 記事フォーマット (サブトピック含む)
  body: "大セクション内で複数トピックが密集している場合は、**サブトピック見出し `### {サブ見出し}`** を使ってさらに整理してよい (Discord で中サイズ表示)。\n\n各記事は以下のフォーマット\
    \ (bullet 階層を浅くして読みやすく):\n\n```\n**{タイトル要約 (60 字以内、日本語)}**\n- {本文サマリ (250〜300 字、日本語)}\n  ← input の\
    \ summary を要約再構成し、「何が起きた / 誰が / どこで / 影響 / なぜ重要」を\n    自然な日本語で記述。タイトルの言い換えで終わらせず content を伝える。\n-\
    \ 出典: {feed_title} → {url}\n```"
  note: ''
- field_id: constraints_core
  kind: rubric
  title: 制約 (基本方針)
  body: "# 制約\n1. **必ず日本語で出力**してください (出典 URL のみ英語可)。\n2. **入力記事は基本的にすべて recap に含めて**ください (情報の見逃し防止が最優先)。\n\
    3. ただし以下の **明確に無価値な記事**のみ skip 可:\n   - 「{vendor} 社が新製品 X をリリース」「announces / launches / unveils」のみで内容のない単純広告\n\
    \   - 「{X} 入門」「初心者ガイド」のような汎用 tutorial"
  note: ''
- field_id: constraints_style
  kind: rubric
  title: 制約 (文体・構成)
  body: "4. **本文サマリは input の summary を要約・再構成して 250〜300 字** に。\n   summary が未保存 (空 or \"未保存\" 表示) の記事のみ\
    \ title からの推測で 1-2 文に短縮可。\n5. 「タイトルの言い換え」を絶対に書かない。必ず title に **無い情報** (どこで・誰が・規模・影響) を含める。\n6. 憶測・推測\
    \ (「〜の可能性」「〜と思われる」) は最小限に。事実ベースで記述。\n7. 各セクション 2-10 件まで (大きすぎるセクションは `###` サブトピックで分割)。\n8. 「今週のトレンド」を読み取れる形に整理\
    \ (単なる箇条書きでなく、グループに意味付け)。\n9. セクション順は重要度が高いものを先頭に。\n10. **最後のセクションのあとには罫線を入れない**。\n11. 出力末尾に「---」とそれ以降のテキストは不要。\n\
    12. **入力記事が全件 skip 候補だとしても、必ず最低 1 セクション・1 件は出力**してください (sanity)。"
  note: ''
- field_id: example_and_closing
  kind: rubric
  title: 出力例と締め
  body: '# 出力例 (構造のみ参考)

    ```

    📰 Weekly Watch Recap ({{ period_label }})


    ## 🌍 今週の Iran 緊張


    **ホルムズ海峡 米国封鎖懸念**

    - 5/4-5/7 で 3 件の関連記事、エスカレーション継続中

    - 出典: Crisis Group → https://...


    ━━━━━━━━━━━━━━━━━━━━━━━━━━━


    ## 📊 今週の業界考察


    **CISO の AI セキュリティ戦略**

    - LLM 導入時の prompt injection 対策フレームワーク提案

    - 出典: Forescout → https://...

    ```


    それでは Weekly Recap を出力してください。'
  note: ''
