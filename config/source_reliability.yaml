# ── 国営メディア / 影響工作 (framing バイアス。信頼度軸でなく「事実は報じうるが意図・
#    責任帰属の framing をそのまま採らない」印)。収集は維持し synthesis で割引する。
#    判定原則 = **国籍でなく国家統制/出資**で分類する。独立系の敵国発ソース
#    (The Insider=反クレムリン調査報道 / NK News=独立 NK ウォッチャー 等) は **含めない**。
#    SubscriptionsPage の tier ピッカーから随時 追加/解除できる (ここは seed)。
state_media:
  hosts:
    - rt.com
    - sputnikglobe.com
    - sputniknews.com
  titles:
    - russia today
    - sputnik
    - pravda            # Pravda/Portal Kombat 影響工作網 (偽装ローカル名・蘭の正規紙でない)
