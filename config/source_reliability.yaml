# Source 信頼度ティア (briefing 評価層 — confidence 算出の入力)。
#
# 用途: synthesis / spotlight の確度バッジ・cross-source 検証 (S1/S4) が「各 source の
# 信頼度」を判定するための SSoT。NATO Admiralty Code の「信頼度 (source reliability)」軸。
#
# レイヤ分離 (重要): これは **briefing 評価層の表示用**で routing には使わない。routing の
# 信頼性判定は Phase B-cal で content-based (editorial_stance) に一本化済 (source_quality.yaml
# 参照)。ここは抑制・降格でなく「読者に各主張の足場を提示する」目的に限定する。
#
# マッチ規則:
#   - hosts: host suffix 一致 ("cloudflare.com" は "blog.cloudflare.com" にマッチ)
#   - titles: feed_title の部分一致 (小文字、host 不明 source の補助)
#   - 判定順: social → official → research → (列挙外) news → (title/url 共に空) unknown
#   - 列挙外は news (default)。
#
# **編集可** (config/ は UI allowlist 内)。新 source 追加時はここに分類を足すと
# コード変更なしで confidence が正確になる。迷ったら news のまま (過大評価しない方が安全)。

# ── 一次 advisory / 公式機関 (Admiralty A 相当) ──
official:
  hosts:
    - cisa.gov
    - jpcert.or.jp
    - jvn.jp            # JVN / JVN iPedia (jvndb.jvn.jp も suffix で含む)
    - ipa.go.jp
    - ncsc.gov.uk
    - ncsc.govt.nz
    - ssi.gouv.fr       # ANSSI France (CERT-FR)
    - bsi.bund.de
    - cert.pl
    - enisa.europa.eu
    - csa.gov.sg
    - cnil.fr
    - cisecurity.org    # CIS (security benchmarks)
    - cyber.gc.ca
    - us-cert.gov
    - aws.amazon.com    # AWS Security Bulletins
  titles:
    - cisa
    - jpcert
    - "jvn"
    - anssi
    - "cert-fr"
    - "cert polska"
    - enisa
    - "ncsc"
    - bsi
    - ipa
    - "cyber security agency of singapore"
    - cnil

