# Kuebiko (久延毘古) — CTI briefing pipeline。単一コンテナ運用 (Phase 1.5)
#
# CLAUDE.md §12 に準拠:
# - ports は 127.0.0.1:8000 のみ (LAN/外部公開禁止)
# - restart: unless-stopped でクラッシュ自動復旧
# - ホストネイティブ Ollama に host.docker.internal:11434 で接続
# - 設定 / プロンプト / ログを volume でホスト共有

# compose プロジェクト名をディレクトリ名 (auto-post) から独立させて固定 (2026-07-31)。
# OrbStack 等のグループ表示・ビルドイメージ接頭辞・ネットワーク名が kuebiko になる。
# ローカル dir は memory/session 紐づけのため据え置き (リネームしない) の方針とセット。
name: kuebiko

services:
  # Phase Y: PostgreSQL service (SQLite からの移行先)。
  # macOS virtiofs bind mount での SQLite WAL 衝突 corruption (2026-05-26 実例)
  # への根本対処として PostgreSQL を採用。data は named volume 経由で virtiofs
  # を回避し、concurrent write 安全性を確保する。
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuebiko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cti_local_dev}
      POSTGRES_DB: kuebiko
      # initdb args: locale を設定し UTF-8 安定
      LANG: ja_JP.UTF-8
      LC_COLLATE: C
      LC_CTYPE: C.UTF-8
    ports:
      # 127.0.0.1 のみバインド (LAN/外部公開禁止)
      # host から psql で覗くために 5433 に expose (既存 pg と衝突回避)
      - "127.0.0.1:5433:5432"
    volumes:
      # virtiofs を避けるため named volume を使う (bind mount 不使用)
      - kuebiko_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuebiko -d kuebiko"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  # Phase 0 F1: PostgreSQL 日次バックアップ sidecar (decoupled、app 障害時も動く)。
  # postgres:16-alpine は pg_dump 内蔵。./data/backups に -Fc dump を出力し 14 日 rotation。
  # 復元は scripts/restore_db.sh。
  backup:
    image: postgres:16-alpine
    container_name: backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-cti_local_dev}
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      - ./data/backups:/backups
      - ./scripts/backup_loop.sh:/backup_loop.sh:ro
    entrypoint: ["sh", "/backup_loop.sh"]
    deploy:
      resources:
        limits:
          memory: 256m

  kuebiko:
    build:
      context: .
      dockerfile: Dockerfile
    image: kuebiko:latest
    container_name: kuebiko
    depends_on:
      postgres:
        condition: service_healthy

    # 127.0.0.1 のみバインド (LAN/外部からは到達不可)
    # ホスト側 8001 → コンテナ内 8000 (uvicorn デフォルト) にマップ
    ports:
      - "127.0.0.1:8001:8000"

    restart: unless-stopped

    # ホストの Ollama に到達可能に (Linux/Mac 互換)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      TZ: Asia/Tokyo
      LANG: ja_JP.UTF-8
      LC_ALL: ja_JP.UTF-8
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # コンテナから host の Ollama に届く既定。UI (モデルタブ) の編集が .env に保存され、
      # コンテナ再作成時にここへ補間される (設定・死活の画面統合 P3 — .env が SSoT)。
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # PostgreSQL 接続先 (Phase Y 移行済・本番の SSoT。未設定時のみ SQLite fallback)
      DATABASE_URL: postgresql://kuebiko:${POSTGRES_PASSWORD:-cti_local_dev}@postgres:5432/kuebiko
      # 案 B: Discord 投稿先を config 駆動 rule engine (DB の routing ルール) で決定。
      # 既定 0=旧ハードコード ladder。1=engine (seed は legacy と等価、UI で編集可)。
      ROUTING_RULES_ENGINE: ${ROUTING_RULES_ENGINE:-1}
      # synthesis 信頼性再設計: 証拠駆動パイプライン (証拠接地→ACH→敵対的検証→較正→射影)。
      # 0 (既定)=現行 single-pass / 1=証拠駆動 / shadow=旧出力維持+grounded 並走 log 比較。
      SYNTHESIS_GROUNDED: ${SYNTHESIS_GROUNDED:-0}
      # Situation Ledger (状況台帳): 持続する情勢ライン (割当/増分ACH/detect-new/lifecycle)。
      # 0 (既定)=無効 / shadow=旧経路出力+台帳のみ更新 (段A) /
      # 1=台帳駆動が出力源 (段B: 割当→増分ACH→PIR注入detect-new→adversarial→射影)。
      SYNTHESIS_STATE: ${SYNTHESIS_STATE:-0}
      # Actor Recall Layer: 辞書未収録の新興アクター候補を採取 (暗定 entity + 週次 proposal)。
      # 0 (既定)=無効 / 1=採取有効。確定アクター層・routing には無影響 (deploy-dark)。
      ACTOR_CANDIDATE_HARVEST: ${ACTOR_CANDIDATE_HARVEST:-0}
      # 常設情報要求 standing situations (段A): prepositioning posture の seed 開設 + 収穫のみ。
      # 0 (既定)=無効 / 1=収穫有効 (評価接続は段B)。設計: docs/prepositioning_posture_ledger_design.md
      STANDING_SITUATIONS: ${STANDING_SITUATIONS:-0}
      # PIR signal-first 照合: PIR match を生キーワード OR ではなく取込 LLM の意味プロパティ
      # (category/intent/victim_sector/is_ransomware) 述語で判定。0 (既定)=旧 strong_signals
      # keyword / 1=signal-first (match ツリーを持つ PIR のみ切替、他は keyword)。
      # 設計: docs/pir_signal_first_matching_design.md
      PIR_SIGNAL_FIRST: ${PIR_SIGNAL_FIRST:-1}
      # 概念 PIR の LLM 主題判定 (0 で候補ゲートのみに degrade)。
      # 設計: docs/pir_concept_llm_judge_design.md
      PIR_LLM_JUDGE: ${PIR_LLM_JUDGE:-1}
      # 群化の ML 判定をシャドー観測する (2026-08-31)。本番の挙動は変えず、
      # 26B の判定と 19 特徴を event_pair_shadow へ貯めるだけ。0 で停止。
      EVENTNEWS_PAIR_SHADOW: ${EVENTNEWS_PAIR_SHADOW:-0}
      # ML 判定を **群化に反映する** (2026-08-31)。実測 (365 組・群単位):
      # 決定論 67% → 83%、誤結合 33 → 14。LLM が落ちても 85% を保つ
      # (欠測を「不明」として学習済み)。0 で決定論へ戻る。
      EVENTNEWS_PAIR_ML: ${EVENTNEWS_PAIR_ML:-0}
      # 被害組織名の法人格・Holdings・グループの付け外しを畳んで群化の entity を照合する (2026-10-12)。
      # 照合規則 30/30 (別標本 30/30)、alert の重複の回収 14→22/52 (再現)、新しい辺の適合 39/45
      EVENTNEWS_ORG_NORM: ${EVENTNEWS_ORG_NORM:-1}
      # 被害組織名の別名 (日本語 ⇔ 英語・略称・旧社名・親子会社) を logprob 判定で畳む (2026-10-12)。
      # 0=off / shadow=判定だけ記録 / 1=群化の entity を置き換える。要 EVENTNEWS_ORG_NORM=1。
      # 10-22 利用者判断: shadow のまま運用 (確認用で誤同一視 0/62 だが Opus 確認待ち)。既定を .env の値に揃えた。
      # 判定役は素の fast ティア (step org_identity_judge)。src/eventnews/org_identity.py
      EVENTNEWS_ORG_IDENTITY: ${EVENTNEWS_ORG_IDENTITY:-shadow}
      # 統合で、両事象が主題の CVE を持ち共有ゼロなら結ばない (2026-10-12)。統合 40 組で適合 75%→85%
      EVENTNEWS_MERGE_CVE_GATE: ${EVENTNEWS_MERGE_CVE_GATE:-1}
      # 伏字 (*) を含む被害組織名を群化・統合の結合から外す (2026-10-15)。14 日で 3 件止め、Opus 裁定で誤り 0/3
      EVENTNEWS_MASKED_VICTIM_GATE: ${EVENTNEWS_MASKED_VICTIM_GATE:-1}
      # 片方だけが一括の勧告 (CVE が多い記事) で根拠が CVE だけの統合の辺を張らない (2026-10-15)。14 日で 5 件止め誤り 0/5
      EVENTNEWS_MERGE_BULLETIN_BRIDGE_GATE: ${EVENTNEWS_MERGE_BULLETIN_BRIDGE_GATE:-1}
      # ハブ (複数 CVE を並記する大きな事象) の主題でない CVE を橋にした吸収を止める (2026-10-22)。既定 off:
      # 正解 80 組で誤り 3 止め/正しい 1 止め、14 日の本番で 3 件止まるが効果が小さく新しい Opus 正解で確認するまで保留
      EVENTNEWS_MERGE_HUB_GATE: ${EVENTNEWS_MERGE_HUB_GATE:-0}
      # 統合の辺に許す記事対の時間差の上限 (日、2026-10-22)。0 で無制限。判定が緩む方向 (ML のずれ・ハブ) の歯止め
      EVENTNEWS_MERGE_MAX_GAP_DAYS: ${EVENTNEWS_MERGE_MAX_GAP_DAYS:-60}
      # 統合の ML に種別を DB の実値で渡し、要約埋込の欠けを毎時 500 件まで埋める (2026-10-22、既定 off)。
      # 80 組の再現では効果が出なかったため off。docs/event_identity_definition.md
      EVENTNEWS_MERGE_REAL_KIND: ${EVENTNEWS_MERGE_REAL_KIND:-0}
      # 月だけが違う月次レポートどうしを統合しない (2026-10-22)。正解 80 組で誤り 1 止め・正しい 0 止め
      EVENTNEWS_MERGE_REPORT_PERIOD_GATE: ${EVENTNEWS_MERGE_REPORT_PERIOD_GATE:-1}
      # 事象の焦点を毎時の群化・統合の後に記録する (2026-10-24 F0、記録だけで判断には使わない)。0 で止まる
      EVENTNEWS_FOCUS_RECORD: ${EVENTNEWS_FOCUS_RECORD:-1}
      # 統合の判断で、事象の焦点の照合が conflict の組を結ばない (2026-10-24 F2)。on / shadow (記録だけ) / off。
      # 新標本 31 組で止めた組の本当に別 84% (区間 67〜93%)、30 日の再現で 37 件。docs/eventnews_focus_redesign.md §9.4
      EVENTNEWS_MERGE_FOCUS_GATE: ${EVENTNEWS_MERGE_FOCUS_GATE:-on}
      # detect の判断を部品に分けた形を記録だけする (2026-10-16、0=off / shadow / 1=置換)。shadow は本番の開設の後に
      # 予算 120 秒・書き手 6 件までで動き、結果は detect_bundles (variant=decompose_shadow) に残る
      DETECT_DECOMPOSE: ${DETECT_DECOMPOSE:-shadow}
      # 台帳の割当に埋込の確認を課す (2026-09-24)。規則の「同じ情勢」率は anchor 31% /
      # token 4% (Opus 盲検 362 組) で、類似度 0.6 の確認で精度 28% → 67%・同じ情勢の 86% を残す。
      # off / shadow (落ちるはずの割当をログに出すだけ) / on (落ちた記事を未割当へ戻す)。
      ASSIGN_EMBED_GATE: ${ASSIGN_EMBED_GATE:-shadow}
      # 割当の ML に gemma4:26b の「記事は情勢の証拠か」の確率を足す (同条件で回収 60→73%・精度 80→82%)。
      # model_tiers の step:assign_evidence_judge = gemma4:26b が前提 (未設定なら fast = 無情報)
      ASSIGN_PROBE_FEATURE: ${ASSIGN_PROBE_FEATURE:-1}
      # 2026-10-11 の関門 (戻すときは .env で 0 に)。被害国の語の関門 (新標本で正しい値を落とした 0/34)・
      # 薄い本文の関門 (別標本で適合率 12/13・誤発火 1/72)・SIR 別の要点の識別子の関門は有効、
      # 翻訳の化けの関門は語の修復が 16/29 しか正しくないため無効のまま
      VICTIM_COUNTRY_GATE_KEYWORD: ${VICTIM_COUNTRY_GATE_KEYWORD:-1}
      # 被害国の取りこぼしを決定論の規則で埋める (2026-10-22): shadow=埋める値をログに出すだけ /
      # 1=適用 / 0=無効。Opus 裁定 69 件で誤り 0・判断不能 2 だが、補完は 90 日で 22 件と小さいため
      # まず shadow (docker logs kuebiko | grep victim_country_fill で確認してから 1 へ)
      VICTIM_COUNTRY_FILL: ${VICTIM_COUNTRY_FILL:-shadow}
      # 関与国の付けすぎの関門 (2026-10-12): 1=有効 / 0=無効 / shadow=落とす国をログに出すだけ。
      # 正解集 150 件で適合率 69%→87%・回収率 94%→82% だが、調整と測定が同じ標本のため shadow で開始
      # (新しい正解 = upstream_accuracy 段 B で確かめてから on)
      INVOLVED_COUNTRY_GATE: ${INVOLVED_COUNTRY_GATE:-1}
      THIN_BODY_GATE: ${THIN_BODY_GATE:-1}
      # 薄い本文の 2 段目: 決定的な条件をすり抜けた 600 字未満の本文を fast ティアの logprob で判定
      # (Jev 型、別標本 p2b で 2 段の回収 12/27→19/27・誤発火 1/72 のまま)
      THIN_BODY_PROBE: ${THIN_BODY_PROBE:-1}
      PIR_FOCUS_FIDELITY_GATE: ${PIR_FOCUS_FIDELITY_GATE:-1}
      # 台帳 claim の主語の関門 (2026-10-19 on): 問いの対象国に言及しない新 claim は採らず前回を保持。
      # shadow=記録のみ / off=無効。常設の問いの改訂 76 件で発火 1 件 (1.3%)
      LEDGER_CLAIM_SUBJECT_GATE: ${LEDGER_CLAIM_SUBJECT_GATE:-on}
      # まとめ記事 (複数の独立した事案の束) は重要度の上限を medium にする (2026-10-19 title)。
      # title=見出しの型で判定して適用 / shadow=ログのみ / off=無効
      ROUNDUP_IMPORTANCE_CAP: ${ROUNDUP_IMPORTANCE_CAP:-title}
      # サイバーでない地政学・政策記事の high を medium に下げる (2026-10-24 on、重さは strategic_weight に残る)。
      # shadow=ログのみ / off=無効
      GEOPOLITICAL_HIGH_CAP: ${GEOPOLITICAL_HIGH_CAP:-on}
      # TTP の歯止め (実在しない ID を落とす・同じ引用は 2 技術まで・12 件超は語の裏付けのある技術を優先、10-24)。保存済み 300 件で 20 件以上が 0 件・裏付けのある技術の脱落 3〜4 件
      TTP_LIMIT: ${TTP_LIMIT:-on}
      # 薄い Grok の投稿の要約が本文に無い数字・日付を足したら作り直す (既定 shadow、3〜7 日ログを見てから on)
      GROK_SUMMARY_GROUNDING: ${GROK_SUMMARY_GROUNDING:-shadow}
      # Grok の投稿が貼った外部リンクの本文取得 (既定 shadow = 取って保存、要約には使わない、10-24)
      GROK_LINK_FETCH: ${GROK_LINK_FETCH:-shadow}
      # SIR 別の要点の文ごとの裏付け判定 (logprob、測定 131 文で裏付けなし検出 15/34・誤検出 2/97)
      PIR_FOCUS_CLAIM_GATE: ${PIR_FOCUS_CLAIM_GATE:-1}
      # 当局の摘発発表を alert から watch に下げる (語の条件のみ、正解 185 件で精度 10/11・回収 10/10)。
      # 2026-10-12 有効化 (v13 の配信を本番と同じ関数の再現で確認した後)
      ALERT_EXCLUDE_LAW_ENFORCEMENT: ${ALERT_EXCLUDE_LAW_ENFORCEMENT:-1}
      # 翻訳の化け (固有名詞・識別子・数字) を検出したら訳を保存せず原文を出す (2026-10-12)。
      # on = 語・識別子・数字のどれでも / ident = 識別子 (CVE・ハッシュ・IP 等) の化けだけ
      # (語・数字は log のみ) / shadow = 全部 log のみ / off。修復はしない。既定 shadow:
      # on は 14 日で 30% の訳が消える、ident は約 2% (識別子の検出は精度ほぼ 100%、
      # 語 約 5 割・数字 1 割未満)。ログ translate_fidelity_garbled に blocked / 種類別件数
      # 10-12 夜: ident で有効化 (14 日の再現で消える訳 1.9%・識別子の検出 41 件すべて本物)
      TRANSLATE_FIDELITY_GATE: ${TRANSLATE_FIDELITY_GATE:-ident}
      # 割当の判定を ML (config/models/assign_model.json) で行う (2026-09-24)。規則の候補の中で
      # 精度 75% / 回収 81% (埋込の関門のみは 67% / 86%)。モデルが無ければ埋込の関門へ退避。
      ASSIGN_ML: ${ASSIGN_ML:-0}
      # 状況総括の CoT 欄 (analysis_notes)。n17c は CoT ありで学習・評価して採用したので 1 で動かす
      # (2026-09-26: 未設定のまま CoT なしで動いていた = 評価した形と本番の形が食い違っていた)
      SYNTHESIS_COT_NOTES: ${SYNTHESIS_COT_NOTES:-0}
      # cluster 帯 dedup の救済網 (実測 10.2% の誤 dedup を取込へ倒す)。既定 off
      DEDUP_CLUSTER_JUDGE: ${DEDUP_CLUSTER_JUDGE:-0}
      # --- s24c 切替の旗 (2026-10-22、data/eval/S24c_switch_runbook.md)。**既定はすべて現行 (s23i) の挙動**。
      # モデル割当 (UI「設定 → モデル」) と同時に揃える。片方だけ上げた状態は避ける
      # 深刻度の軸を本文入力 + 公開日つきの v10 に (s24 系で学習。detect ML の差し替えと同時)
      AXES_FROM_BODY: ${AXES_FROM_BODY:-0}
      # PIR 判定の理由を「40 字以内」に (s24b/s24c の教師に合わせる。既定 30 字)
      PIR_JUDGE_REASON_V2: ${PIR_JUDGE_REASON_V2:-0}
      # ACH の証拠を保存の前に 6 件へ切る (s24b/s24c の教師の形)
      ACH_EVIDENCE_CAP: ${ACH_EVIDENCE_CAP:-0}
      # YYYY-MM-01 を本当の 1 日として扱う / 相対表現のみの記事の basis を残す (vnext の判断プロンプト用)
      EVENT_DATE_MONTH_FORM: ${EVENT_DATE_MONTH_FORM:-0}
      # SIR 別の要点を v6.2 の文面・長い出力で: 空=モデルが s24c 系のときだけ / 1=常に / 0=常に従来
      PIR_FOCUS_PROMPT_V6: ${PIR_FOCUS_PROMPT_V6:-}
      # 要約の基準を v8r4 (config/prompts/summarizer_rubric_v8r4.yaml) に。DB より優先 (DB は書かない)
      SUMMARIZER_RUBRIC_V8R4: ${SUMMARIZER_RUBRIC_V8R4:-0}
      # Tier1 認証 (2026-08-02)。**full instance では認証を行わない** (127.0.0.1 バインドの
      # ローカル専用) が、設定画面が「公開面の認証が設定済みか」を正しく表示するために
      # 同じ値を渡す。認証の実施は readonly instance のみ。
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      # ログアウト後の戻り先 (公開ニュースサイト。未設定なら /app/ へ戻る)
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      # (通知再設計 web-only disposition は channel レジストリの push 属性=情報フローで設定。
      #  env フラグは廃止し制御面を routing/flow に一本化した)
      # (GIT_AUTHOR/COMMITTER env は撤去: アプリの git auto-commit は廃止済 = git を触らない)
      # LLM 呼出の同時実行数 (2026-08-17)。既定は現行挙動 (記事=逐次 / triage=5)。
      # 実測 (gemma4:26b、4 件 x 3 往復 ABABAB、OLLAMA_NUM_PARALLEL=4):
      #   decode 主体 (記事処理、出力 400tok): 逐次 33.24s → 並列 17.98s = 1.85x (効く)
      #   prefill 主体 (triage、出力 16tok):   逐次  9.84s → 並列  9.89s = 1.00x (変わらない)
      # **2 点セットで効く**: ホストの OLLAMA_NUM_PARALLEL を上げる (既定 1 スロットは
      # 同時要求を直列化するため、これが無いと他が効かない) + ARTICLE_CONCURRENCY を上げる。
      # TRIAGE_CONCURRENCY は速度上どちらでもよい (既定 5 のままでよい)。
      ARTICLE_CONCURRENCY: ${ARTICLE_CONCURRENCY:-1}
      TRIAGE_CONCURRENCY: ${TRIAGE_CONCURRENCY:-5}
      # triage で low に落ちた記事のうちサイバー政策を medium に救済する段 (docs/importance_relevance_redesign.md §6b)。
      # off (既定) / shadow=判定を data/policy_rescue_shadow.jsonl に貯めるだけ / 1=救済を有効化。
      CYBER_POLICY_RESCUE: ${CYBER_POLICY_RESCUE:-off}
      # M4 (取り込み、2026-10-12 有効化): 平たい triage (深刻さの見込みだけ) ∨ 取り込みヒント
      # (日本・注視国・関連性の核 SIR)。並走 4.3 日 1,213 件で日本の取りこぼし 0・取り込み −9.7%、
      # 過去 30 日の再現でも日本 0。保存される importance は要約の段が付けるので下流は不変
      TRIAGE_FLAT: ${TRIAGE_FLAT:-1}
      INGEST_RULE_V2: ${INGEST_RULE_V2:-1}

    # 設定・プロンプト・データを bind mount で共有
    # .env のみ ro だが UI の設定編集 API は別途 atomic write で更新する
    volumes:
      - ./data:/app/data:rw
      - ./config:/app/config:rw
      - ./prompts:/app/prompts:rw
      - ./.env:/app/.env:rw
      # (.git マウントは撤去 [有機的結合監査 L2]: アプリの git auto-commit 廃止に伴い
      #  runtime で git を触るコードはゼロ。開発リポジトリの container 内露出も解消)
      # Phase 2: Playwright セッション state (data/playwright/state.json) は data/ に
      # 含まれるので追加マウント不要

    # リソース上限 (M5 Max 128GB のうち 6GB を上限に。
    # Phase 2 から Playwright Chromium が同居するため 4g → 6g に拡張)
    deploy:
      resources:
        limits:
          memory: 6g

    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/api/health', timeout=3.0).raise_for_status()"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Phase Diamond verify-mobile: 外部公開 (Cloudflare Tunnel 経由) 向けの read-only instance。
  # 同じ image / DB / config を共有するが、READ_ONLY=1 で write 全 API を 403 で block。
  # ports は 127.0.0.1:8002 にバインド (cloudflared がこの 8002 を proxy する)。
  readonly:
    image: kuebiko:latest
    container_name: readonly
    # 起動を full instance の healthy まで待って直列化する。
    # 短縮形 (start のみ待つ) だと full と readonly の lifespan が同じ PG に対して
    # seed/migration を並行実行し DeadlockDetected で片方が落ちていた (自己回復はするが
    # deploy 毎に 1 restart)。full が seed/migration を終え healthy になってから readonly を
    # 起動すれば readonly 側は冪等 no-op になり競合しない。
    depends_on:
      kuebiko:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8000"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Tokyo
      LANG: ja_JP.UTF-8
      LC_ALL: ja_JP.UTF-8
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      READ_ONLY: "1"
      DATABASE_URL: postgresql://kuebiko:${POSTGRES_PASSWORD:-cti_local_dev}@postgres:5432/kuebiko
      # 閲覧専用インスタンスでも PIR 表示を full と一致させる (signal-first / LLM 判定同期)。
      PIR_SIGNAL_FIRST: ${PIR_SIGNAL_FIRST:-1}
      PIR_LLM_JUDGE: ${PIR_LLM_JUDGE:-1}
      # Tier1 認証 (2026-08-01)。両方セットしたときだけ Cloudflare Access 検証が有効になり、
      # 認証済み利用者に運用系ページの閲覧と即時実行を解放する (未設定 = 匿名閲覧のみ)。
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      # ログアウト後の戻り先 (公開ニュースサイト。未設定なら /app/ へ戻る)
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      # 認証済み write の転送先 (write の実行主体は常に full instance)
      FULL_INSTANCE_URL: ${FULL_INSTANCE_URL:-http://kuebiko:8000}
      # 遠隔 (Tier1) からの設定変更を許可するか。既定は 0 = 閉じる。
      # ⚠ 開けると防御が「公開プロセスが write を持たない」構造から
      #    「Access の設定が正しいこと」へ移る。開けた場合でも:
      #    ・書けるのは DB 由来の運用設定だけ (REMOTE_WRITE_ALLOWLIST、未登録は拒否)
      #    ・資格情報は flag に関わらず遮断
      #    ・実行主体は full へ転送 (readonly は口だけ持ち能力は持たない)
      #    ・すべて access_audit に記録してから通す
      READ_ONLY_ALLOW_REMOTE_WRITE: ${READ_ONLY_ALLOW_REMOTE_WRITE:-0}
    volumes:
      # readonly side は config / prompts / .env を :ro でマウント (改変防止の二重防御)
      # data は SQLite WAL を共有のため :rw (read のみだが lock 用)
      - ./data:/app/data:rw
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - ./.env:/app/.env:ro
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/api/health', timeout=3.0).raise_for_status()"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Claude Code サブスク bridge sidecar (2026-07-24 — ホスト LaunchAgent 常駐の解消)。
  # claude CLI は永続 volume (./data/claude-bridge) に自己インストール/更新され、
  # イメージ再ビルド不要。認証は UI で貼付する CLAUDE_CODE_OAUTH_TOKEN (.env)。
  # ポートはホストに公開しない (compose 内部ネットワークのみ)。
  # app 側の接続切替: .env の CLAUDE_CODE_BRIDGE_URL=http://claude-bridge:8010
  # (rollback = この行を外してホスト LaunchAgent bridge に戻す)。
  claude-bridge:
    build:
      context: .
      dockerfile: Dockerfile.claude-bridge
    image: kuebiko-claude-bridge:latest
    container_name: claude-bridge
    restart: unless-stopped
    environment:
      BRIDGE_ENV_FILE: /app/.env
      BRIDGE_USAGE_FILE: /data/claude_bridge_usage.jsonl
      # CLI 自己更新 (0 で版固定)
      CLAUDE_BRIDGE_AUTOUPDATE: ${CLAUDE_BRIDGE_AUTOUPDATE:-1}
    volumes:
      - ./data/claude-bridge:/data:rw
      - ./.env:/app/.env:ro
    deploy:
      resources:
        limits:
          memory: 512m

  # Phase Diamond verify-mobile: Cloudflare Tunnel sidecar。
  # readonly (port 8000 in container) を quick tunnel で外部公開。
  # supervisor 内で flag file (data/.mobile_tunnel_enabled) を監視し real-time toggle。
  # UI から POST /api/v1/mobile-tunnel/{enable,disable} で制御。
  # URL 取得時に DISCORD_WEBHOOK_OPS に通知。
  tunnel:
    build:
      context: ./cloudflared
    image: kuebiko-tunnel:latest
    container_name: tunnel
    depends_on:
      readonly:
        condition: service_healthy
    restart: unless-stopped
    environment:
      TUNNEL_TARGET: http://readonly:8000
      DISCORD_WEBHOOK_OPS: ${DISCORD_WEBHOOK_OPS:-}
      # 初回 deploy 時の default 状態 (以降は UI toggle で永続管理)
      MOBILE_TUNNEL_DEFAULT_ENABLED: ${MOBILE_TUNNEL_DEFAULT_ENABLED:-1}
      # named tunnel の token / hostname は **env で注入しない** (2026-07-30, C2)。
      # 理由: cloudflared は起動時に CLOUDFLARE_* env を INF ログにダンプするため、env 注入は
      # token を docker logs に露出させる。代わりに UI から data/ ファイル (0600) に保存し、
      # launcher が --token 引数で渡す (src/tools/mobile_tunnel_files.py が契約 SSoT)。
      # launcher には env→ファイル seed のフォールバックもあるが、それは CLOUDFLARE_TUNNEL_TOKEN が
      # コンテナ env に在る場合のみ発火する (ここで注入しないので通常は不発)。既存環境からの移行は
      # data/ ファイルへ直接書いて行う (docs/mobile-access.md)。
    volumes:
      # M1 (least-privilege 2026-07-30): tunnel コンテナには **専用サブディレクトリだけ** を
      # mount する (flag / url / token / hostname の交換場所)。./data 全体 (SQLite / playwright
      # state 等) は最前線コンテナに渡さない。app とは host の ./data/mobile_tunnel/ を共有。
      - ./data/mobile_tunnel:/app/data/mobile_tunnel:rw
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  # Phase Y: PostgreSQL data (named volume、virtiofs 回避)
  kuebiko_pgdata:
    # 実 volume 名を project prefix (dir 名) から独立させる (dir リネームでも不変)
    name: kuebiko_pgdata
    driver: local
