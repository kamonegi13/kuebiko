<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover は必須 (2026-08-19): これが無いと iOS Safari は
         env(safe-area-inset-*) を常に 0 として返すため、AppShell の下部 padding と
         BottomTabBar の safe-area padding が両方とも効かない。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b0d11" />
    <title>Kuebiko — 久延毘古</title>

    <!-- PWA: manifest とアイコンのみ。Service Worker は意図的に入れない
         (SW はインストールしていないブラウザ利用者にも効いてしまい、
          index.html の no-cache 設計 / Cloudflare Access の 302 と競合するため)。
         manifest はインストールするまで不活性なので、ブラウザ側の挙動は変わらない。 -->
    <link rel="manifest" href="/app/pwa/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/app/pwa/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/app/pwa/favicon-32.png" />
    <link rel="apple-touch-icon" href="/app/pwa/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Kuebiko" />
  </head>
  <body class="bg-bg text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
