<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover は必須 (2026-08-19): これが無いと iOS Safari は
         env(safe-area-inset-*) を常に 0 として返すため、AppShell の下部 padding と
         BottomTabBar の safe-area padding が両方とも効かない。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#faf9f6" />
    <title>Kuebiko — 久延毘古</title>

    <!-- テーマ確定。**描画前に属性を立てる** (React 待ちだと初回に別配色が一瞬出る)。
         既定は **ライト** (2026-08-28 利用者判断)。利用者が明示的に選んだ値が
         あればそれを優先する (公開サイトと同じ鍵)。 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("kuebiko-theme");
          document.documentElement.setAttribute("data-theme", saved || "light");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", saved === "dark" ? "#0b0d11" : "#faf9f6");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <!-- 和文 Web フォント (2026-08-28 可読性診断)。
         これが無いと和文は OS 任せ (macOS=ヒラギノ / Windows=Meiryo / Linux=総称) で、
         閲覧環境ごとに別の書体で出る。CTI のテキストは "CVE-2026-16232" のように
         和欧が一行で何度も切り替わるため、混植が揃わないと字面とウェイトがばらつく。
         preconnect は Google Fonts の 2 ホスト両方に要る (CSS と font 本体で別ホスト)。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
    />

    <!-- PWA: manifest とアイコンのみ。Service Worker は意図的に入れない
         (SW はインストールしていないブラウザ利用者にも効いてしまい、
          index.html の no-cache 設計 / Cloudflare Access の 302 と競合するため)。
         manifest はインストールするまで不活性なので、ブラウザ側の挙動は変わらない。 -->
    <!-- ⚠ crossorigin="use-credentials" が要る。Access 配下では manifest の取得に
         cookie が付かず、ログインへリダイレクトされて CORS で落ちる
         (2026-08-29 実測)。同一オリジンでも manifest は既定で無資格取得になる。 -->
    <link rel="manifest" href="/app/pwa/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/svg+xml" href="/app/pwa/ops/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/app/pwa/ops/favicon-32.png" />
    <link rel="apple-touch-icon" href="/app/pwa/ops/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Kuebiko" />
  </head>
  <body class="bg-bg text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
