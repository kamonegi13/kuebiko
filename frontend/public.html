<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 広く公開する意図はない。組織内の限られた読者に URL を渡す運用なので、
         検索エンジンには載せない (robots.txt も併せて置く)。 -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#faf9f6" />
    <title>kuebiko — サイバー脅威ニュース</title>

    <!-- ⚠ 和文 Web フォント。運用画面 (index.html) にだけ入れて**ここに入れ忘れていた**
         ため、公開サイトは Noto Sans JP を指定しているのに読み込んでいなかった
         (2026-08-28)。公開面と運用画面は別ビルド・別 HTML なので、head の追加は両方に要る。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
    />

    <!-- テーマ確定。**描画前に属性を立てる** (React 待ちだと初回に暗い画面が一瞬出る)。
         既定は **ライト** (2026-08-28)。ニュースは日中の屋外でも読まれるので、
         読み物としては明るい面を標準にする。OS が暗い設定のときだけそちらに従い、
         利用者が明示的に選んだ値があれば常にそれを優先する。 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("kuebiko-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved || (prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#faf9f6" : "#0b0d11");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <!-- PWA: manifest とアイコンのみ。Service Worker は入れない (運用画面と同じ方針 —
         SW はインストールしていない利用者にも効き、キャッシュの陳腐化を招く)。
         ⚠ scope / start_url は **静的配信のルート** (`/`)。運用画面の manifest
         (scope: /app/) を流用すると standalone にならない。 -->
    <link rel="manifest" href="/pwa/manifest-public.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/pwa/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/pwa/favicon-32.png" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="kuebiko" />
  </head>
  <body class="bg-bg text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/public-main.tsx"></script>
  </body>
</html>
