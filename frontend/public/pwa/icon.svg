<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Kuebiko">
  <!-- 久延毘古 (案山子) — 歩けぬが天下を悉く知る。
       maskable 安全域 (中心 r=204.8) に全要素を収めてあるため any / maskable 兼用。
       色は frontend/tailwind.config.ts の bg / fg / accent トークンと同値。 -->
  <rect width="512" height="512" fill="#0b0d11"/>
  <!-- 観測圏 -->
  <circle cx="256" cy="256" r="194" fill="none" stroke="#6b88ff" stroke-opacity="0.16" stroke-width="8"/>
  <!-- 支柱 -->
  <rect x="245" y="248" width="22" height="176" rx="11" fill="#e8ebf0"/>
  <!-- 腕木 -->
  <rect x="150" y="288" width="212" height="22" rx="11" fill="#e8ebf0"/>
  <!-- 頭 -->
  <circle cx="256" cy="224" r="44" fill="#e8ebf0"/>
  <!-- 笠 -->
  <path d="M256 96 L336 158 H176 Z" fill="#6b88ff"/>
  <rect x="161" y="152" width="190" height="18" rx="9" fill="#6b88ff"/>
</svg>
