[project]
name = "kuebiko"
version = "0.2.0"
description = "Personal CTI briefing automation: RSS/scraper/Grok to Discord via local LLM, with web management UI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "kamonegi13" }]
keywords = ["cti", "threat-intelligence", "automation", "rss", "discord", "ollama"]

dependencies = [
    # HTTP クライアント (RSS / Discord / Ollama / 記事 URL fetch)
    "httpx>=0.27,<1.0",
    # 本文抽出
    "trafilatura>=2.0,<3.0",
    # Discord Webhook 投稿
    "discord-webhook>=1.3,<2.0",
    # YAML 設定
    "pyyaml>=6.0,<7.0",
    # .env ロード
    "python-dotenv>=1.0,<2.0",
    # 構造化ログ
    "structlog>=24.0,<26.0",
    # ローカル LLM クライアント
    "ollama>=0.4,<1.0",
    # データ検証
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    # LLM プロンプトテンプレ
    "jinja2>=3.1,<4.0",
    # Web UI フレームワーク (Phase 1.5)
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    # フォーム送信のために必要 (FastAPI が要求)
    "python-multipart>=0.0.20,<1.0",
    # スケジューラ (Phase 1.5)
    "apscheduler>=3.10,<4.0",
    # ブラウザ自動化 (Phase 2: Grok レポート取得)
    "playwright>=1.49,<2.0",
    "numpy>=2.4.4",
    "browser-cookie3>=0.20.1",
    "pyvis>=0.3.2",
    "plotly>=6.7.0",
    "feedparser>=6.0.12",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # Phase E: HTML scraper の CSS selector 解析用
    "beautifulsoup4>=4.12,<5.0",
    "pyjwt>=2.10",
    "cryptography>=44,<46",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "types-PyYAML>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["discord_webhook", "apscheduler.*", "playwright.*"]
ignore_missing_imports = true

# scripts/ 配下のアドホックなスクリプト群。テストは sys.path 追加で import するが
# (scripts/ は package ではない)、mypy はその sys.path 操作を追えないため import を
# 解決できない。scripts/ は型ゲート対象外 (CLAUDE.md §7 は src/ のみ必須) なので、
# ここでは import 解決のみ許可し、テスト側の利用箇所を Any 扱いにする。
[[tool.mypy.overrides]]
module = [
    "audit_triage_calibration",
    "backfill_intent",
    "backfill_axes",
    "claude_code_bridge",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: live Ollama/RSS/Discord/IMAP に接続するテスト (CI では除外可)",
    "e2e: full pipeline スモーク (要 Ollama 稼働)",
]
